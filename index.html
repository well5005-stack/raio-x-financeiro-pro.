<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>RAIO-X Financeiro PRO</title><style>html,body{margin:0;background:#050505;color:#e8cc72;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100%}.load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.box{max-width:520px}.ring{width:44px;height:44px;margin:0 auto 16px;border:3px solid rgba(232,204,114,.18);border-top-color:#e8cc72;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#9a958b;font-size:13px}</style></head><body><div class="load"><div class="box"><div class="ring"></div><strong>Abrindo RAIO-X Financeiro PRO…</strong><p>Carregamento local seguro.</p></div></div><script>(async()=>{try{const files=['bundle/data-01.txt','bundle/data-02.txt','bundle/data-03.txt','bundle/data-04.txt'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const b64=parts.join('').trim();const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Seu navegador precisa estar atualizado.');const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><div class="box"><strong>Não foi possível abrir o RAIO-X.</strong><p>'+String(e.message||e)+'</p><p>Atualize o Chrome ou Edge e tente novamente.</p></div></div>'}})();</script></body></html>
